<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Wasl icon mark: a route connecting two waypoints.
       Origin node -> path with a mid waypoint -> destination node.
       Reads as connection / delivery / logistics link. -->
  <defs>
    <linearGradient id="wasl-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7A733"/>
      <stop offset="1" stop-color="#C6820F"/>
    </linearGradient>
  </defs>

  <!-- rounded square backdrop -->
  <rect width="512" height="512" rx="112" fill="#0C1C2E"/>

  <!-- connecting route: origin (lower-left) -> waypoint (center) -> destination (upper-right) -->
  <path d="M150 362 Q256 362 256 256 Q256 150 362 150"
        fill="none" stroke="url(#wasl-amber)" stroke-width="26"
        stroke-linecap="round"/>

  <!-- dashed continuation hint behind, subtle depth -->
  <path d="M150 362 Q256 362 256 256 Q256 150 362 150"
        fill="none" stroke="#E7A733" stroke-width="26"
        stroke-linecap="round" opacity="0.18"
        transform="translate(10,10)"/>

  <!-- origin node -->
  <circle cx="150" cy="362" r="34" fill="#0C1C2E" stroke="url(#wasl-amber)" stroke-width="20"/>
  <!-- destination node (filled = delivered) -->
  <circle cx="362" cy="150" r="30" fill="url(#wasl-amber)"/>
  <!-- center waypoint -->
  <circle cx="256" cy="256" r="16" fill="#F4F1EA"/>
</svg>
