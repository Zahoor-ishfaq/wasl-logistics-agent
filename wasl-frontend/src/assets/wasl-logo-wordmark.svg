<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wl-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7A733"/>
      <stop offset="1" stop-color="#C6820F"/>
    </linearGradient>
    <style>
      .wm { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #0C1C2E; }
      .tag { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #6B7883; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- icon mark, scaled into the lockup -->
  <g transform="translate(20,26) scale(0.25)">
