    <circle cx="150" cy="362" r="34" fill="#0C1C2E" stroke="url(#wl-amber)" stroke-width="20"/>
    <circle cx="362" cy="150" r="30" fill="url(#wl-amber)"/>
    <circle cx="256" cy="256" r="16" fill="#F4F1EA"/>
  </g>

  <!-- wordmark -->
  <text x="170" y="88" class="wm" font-size="62">Wasl</text>
  <text x="172" y="118" class="tag" font-size="15">CONTROL TOWER</text>
