# =============================================================================
# Wasl — docker-compose (api + redis)
#   docker compose up -d --build     build and start
#   docker compose down -v           stop and remove volumes
# Inside compose the API reaches Redis at host "redis" (service name).
# =============================================================================

services:
  api:
    build: .
    image: wasl-api
    container_name: wasl-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    volumes:
      - wasl-chroma:/app/chroma_db
      - wasl-hf-cache:/home/wasl/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: wasl-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - wasl-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  wasl-chroma:
  wasl-hf-cache:
  wasl-redis: