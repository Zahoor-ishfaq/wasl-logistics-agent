services:
  api:
    build: .
    image: wasl-api
    container_name: wasl-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - wasl-chroma:/app/chroma_db
      - wasl-hf-cache:/home/wasl/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  wasl-chroma:
  wasl-hf-cache: