[build-system]
requires = ["setuptools>=71.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wasl"
version = "0.1.0"
description = "Agentic RAG platform for logistics operations exception investigation"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- Core AI / RAG ---
    "langchain>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.1.15,<0.2.0",
    "langchain-community>=0.2.0,<0.3.0",
    "langgraph>=0.1.0,<0.2.0",

    # --- Embeddings ---
    "sentence-transformers>=3.0.0,<4.0.0",

    # --- Vector store ---
    "chromadb>=0.5.0,<0.6.0",

    # --- Document loading ---
    "pypdf>=4.0.0,<5.0.0",

    # --- Web framework ---
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # --- HTTP client ---
    "httpx>=0.27.0,<0.28.0",

    # --- Security / rate limiting ---
    "slowapi>=0.1.9,<0.2.0",

    # --- Secrets / env ---
    "python-dotenv>=1.0.0,<2.0.0",

    # --- Observability ---
    "langfuse>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
]
eval = [
    "ragas>=0.1.0,<0.2.0",
]

# --- Tool configuration ---

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # FastAPI uses function calls in argument defaults
    "E501",  # long lines in docstrings/examples — cosmetic
    "B904",  # raise ... from — style preference
    "B905",  # zip() strict= — style preference
    "UP042", # str+Enum is fine, don't force StrEnum
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "eval/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "eval/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]