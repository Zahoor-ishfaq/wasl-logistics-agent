[build-system]
requires = ["setuptools>=71.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasl"
version = "0.1.0"
description = "Agentic RAG platform for logistics operations exception investigation"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core AI / RAG
    "langchain>=0.2.0,<0.3.0",
    "langchain-anthropic>=0.1.15,<0.2.0",
    "langchain-community>=0.2.0,<0.3.0",
    "langgraph>=0.1.0,<0.2.0",
    "PyJWT>=2.8,<3",
    "bcrypt>=4,<5",
    "pypdf>=5,<7",

    # Embeddings and vector store
    "sentence-transformers>=3.0.0,<4.0.0",
    "chromadb>=0.5.0,<0.6.0",

    # Document loading
    "pypdf>=4.0.0,<5.0.0",

    # Web framework
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",

    # Database
    "SQLAlchemy>=2.0.0,<3.0.0",
    "alembic>=1.18.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",

    # HTTP and supporting services
    "httpx>=0.27.0,<0.28.0",
    "redis>=5.0.0,<6.0.0",
    "numpy>=1.26.0,<3.0.0",

    # Security and configuration
    "slowapi>=0.1.9,<0.2.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # Observability
    "langfuse>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
]

eval = [
    "ragas>=0.1.0,<0.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "B904", "B905", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "eval/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "eval/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
