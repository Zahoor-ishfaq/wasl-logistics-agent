name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasl-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # 2. Test (mocked LLMs — no real API calls)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wasl
          POSTGRES_PASSWORD: wasl_test_password
          POSTGRES_DB: wasl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wasl -d wasl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ANTHROPIC_API_KEY: "test-key-not-used"
      API_KEY: "test-api-key"
      DATABASE_URL: "postgresql+psycopg2://wasl:wasl_test_password@localhost:5432/wasl"

    defaults:
      run:
        working-directory: wasl-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('wasl-backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Prepare test database
        run: |
          alembic upgrade head
          python -m scripts.seed_shipments

      - name: Run tests
        run: pytest tests/ -v -o addopts=""

  # ---------------------------------------------------------------------------
  # 3. Docker build (proves the image builds in a clean environment)
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: wasl-backend
          push: false
          tags: wasl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max