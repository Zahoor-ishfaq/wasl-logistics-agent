name: CI

# Run on every push and pull request to main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — fast static checks. Fails the pipeline early on style/type errors.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # 2. Test — runs the pytest suite. Uses mocked LLMs, so NO API key needed
  #    and NO network calls. Needs lint to pass first.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        # A dummy key satisfies settings validation; tests mock the LLM
        # so no real Anthropic calls are made.
        env:
          ANTHROPIC_API_KEY: "test-key-not-used"
          API_KEY: "test-api-key"
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 3. Docker build — proves the image builds in a clean cloud environment.
  #    Builds only; does not push. Needs tests to pass first.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wasl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max